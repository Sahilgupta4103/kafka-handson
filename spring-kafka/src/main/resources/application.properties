spring.application.name=spring-kafka

spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer
spring.kafka.consumer.group-id=spring-kafka-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Tell JSON deserializer what Java type to create
spring.kafka.consumer.properties[spring.json.value.default.type]=org.example.OrderEvent

# Trust our application package
spring.kafka.consumer.properties[spring.json.trusted.packages]=org.example

spring.kafka.listener.ack-mode=manual
spring.datasource.url=jdbc:postgresql://localhost:5432/kafka_demo
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true